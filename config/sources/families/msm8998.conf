# Qualcomm MSM8998 (Snapdragon 835) Android phones, booted by the stock ABL (fastboot)
declare -g LINUXFAMILY="msm8998"
declare -g ARCH="arm64"
declare -g BOOTENV_FILE="qcom-abl-noab.txt" # MSM8998 phones are not A/B: single "boot" partition
enable_extension "image-output-abl"

case $BRANCH in

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.4" # Major and minor versions of this kernel.
		declare -g KERNELBRANCH='tag:v7.4-rc3'
		;;

esac

family_tweaks_bsp() {
	:
}
